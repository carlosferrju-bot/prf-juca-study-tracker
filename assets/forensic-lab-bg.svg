<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#020713"/><stop offset=".5" stop-color="#071322"/><stop offset="1" stop-color="#120720"/></linearGradient>
 <radialGradient id="cyan"><stop stop-color="#00e5ff" stop-opacity=".5"/><stop offset="1" stop-color="#00e5ff" stop-opacity="0"/></radialGradient>
 <radialGradient id="violet"><stop stop-color="#8b3dff" stop-opacity=".45"/><stop offset="1" stop-color="#8b3dff" stop-opacity="0"/></radialGradient>
 <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#18334d" stop-opacity=".75"/><stop offset="1" stop-color="#06101d" stop-opacity=".9"/></linearGradient>
 <filter id="glowC"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="glowV"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="3"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#bg)"/>
<ellipse cx="1570" cy="180" rx="600" ry="430" fill="url(#violet)" filter="url(#glowV)"/>
<ellipse cx="1050" cy="700" rx="700" ry="420" fill="url(#cyan)" filter="url(#glowC)"/>
