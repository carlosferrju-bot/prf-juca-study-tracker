<g opacity=".9"><rect x="1010" y="820" width="250" height="155" rx="4" fill="#d8d0b6" transform="rotate(-7 1135 897)"/><text x="1135" y="875" text-anchor="middle" fill="#1b2028" font-family="Arial" font-size="18" font-weight="800" transform="rotate(-7 1135 897)">LAUDO PERICIAL</text><text x="1135" y="905" text-anchor="middle" fill="#50545a" font-family="Arial" font-size="12" transform="rotate(-7 1135 897)">MEDICINA LEGAL • PAPILOSCOPIA</text></g>
<g transform="translate(1500 760)"><rect width="105" height="150" rx="8" fill="#e0bd3a" stroke="#171b21" stroke-width="6"/><text x="52" y="85" text-anchor="middle" font-family="Arial" font-size="70" font-weight="900" fill="#1b1b1b">3</text><text x="52" y="120" text-anchor="middle" font-family="Arial" font-size="12" font-weight="900" fill="#1b1b1b">EVIDÊNCIA</text></g>
<g transform="translate(1680 820) rotate(-15)"><ellipse cx="100" cy="25" rx="90" ry="18" fill="#0b1722" stroke="#516a7c" stroke-width="5"/><rect x="25" y="25" width="150" height="18" rx="8" fill="#172b3b"/><path d="M25 34L-70 100" stroke="#8ca7ba" stroke-width="10"/></g>
