name: Apply forensic dashboard theme

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-forensic-dashboard-theme.yml'
      - 'assets/forensic-lab-bg.svg'

permissions:
  contents: write

jobs:
  apply-theme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject forensic theme into app
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '/* PRF JUCA FORENSIC DASHBOARD THEME */'

          if marker in text:
              print('Forensic theme already present.')
              raise SystemExit(0)

          theme = r'''<style>
          /* PRF JUCA FORENSIC DASHBOARD THEME */
          html, body {
            background: #02060d !important;
          }
          body {
            background-image:
              linear-gradient(90deg, rgba(2,7,15,.88) 0%, rgba(2,7,15,.60) 28%, rgba(2,7,15,.38) 58%, rgba(2,7,15,.46) 100%),
              url("assets/forensic-lab-bg.svg") !important;
            background-size: cover !important;
            background-position: center top !important;
            background-attachment: fixed !important;
            background-repeat: no-repeat !important;
          }
          .app {
            background: transparent !important;
            position: relative;
          }
          .side {
            background: linear-gradient(180deg, rgba(3,10,20,.93), rgba(2,7,15,.84)) !important;
            backdrop-filter: blur(7px) saturate(115%);
            -webkit-backdrop-filter: blur(7px) saturate(115%);
            box-shadow: 12px 0 45px rgba(0,0,0,.34);
          }
          .main {
            background: transparent !important;
          }
          .top h1, .top p {
            text-shadow: 0 2px 18px rgba(0,0,0,.65);
          }
          .card {
            background: linear-gradient(145deg, rgba(8,18,32,.82), rgba(5,12,23,.70)) !important;
            border-color: rgba(52,103,137,.72) !important;
            box-shadow: 0 18px 55px rgba(0,0,0,.34), inset 0 1px 0 rgba(255,255,255,.025);
            backdrop-filter: blur(5px) saturate(115%);
            -webkit-backdrop-filter: blur(5px) saturate(115%);
          }
          .card:hover {
            border-color: rgba(0,229,255,.62) !important;
          }
          .nav button {
            background: rgba(7,18,32,.78) !important;
            border-color: rgba(40,72,100,.42) !important;
            backdrop-filter: blur(3px);
          }
          .nav button:hover, .nav button.active {
            background: linear-gradient(135deg, rgba(18,56,95,.94), rgba(9,36,62,.90)) !important;
          }
          .btn.ghost {
            background: rgba(20,43,68,.78) !important;
          }
          .metric {
            text-shadow: 0 0 20px rgba(0,229,255,.12);
          }
          @media (max-width: 650px) {
            body {
              background-position: 62% top !important;
              background-attachment: scroll !important;
            }
            .side {
              background: rgba(2,8,16,.96) !important;
            }
          }
          </style>'''

          if '</head>' not in text:
              raise SystemExit('index.html: </head> not found')

          text = text.replace('</head>', theme + '</head>', 1)
          path.write_text(text, encoding='utf-8')
      - name: Commit theme
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No theme changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: apply realistic forensic lab dashboard theme'
          git push
