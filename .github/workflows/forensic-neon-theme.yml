name: Apply PRF JUCA police neon background
on:
  push:
    branches: [main, master]
permissions:
  contents: write
jobs:
  theme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact police background
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          style = r'''<style id="prf-juca-police-bg-final">
/* PRF JUCA — BACKGROUND POLICIAL NEON FINAL */
html,body{background:#01050c!important}
body{background-image:linear-gradient(90deg,rgba(1,5,12,.28) 0%,rgba(1,5,12,.10) 45%,rgba(3,3,14,.20) 100%),url("assets/prf-juca-police-bg.webp?v=20260821-final")!important;background-size:cover!important;background-position:center center!important;background-attachment:fixed!important;background-repeat:no-repeat!important}
body::before{content:""!important;position:fixed!important;inset:0!important;z-index:0!important;pointer-events:none!important;background:linear-gradient(90deg,rgba(1,5,12,.18),rgba(1,5,12,.04) 50%,rgba(4,2,16,.14))!important}
.app{position:relative!important;z-index:1!important;background:transparent!important}
.main{background:transparent!important}
.side{background:rgba(2,8,17,.72)!important;backdrop-filter:blur(9px) saturate(120%);-webkit-backdrop-filter:blur(9px) saturate(120%);border-right:1px solid rgba(0,229,255,.28)!important}
.top{background:rgba(2,8,17,.18)!important;border-color:rgba(0,229,255,.15)!important;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.card{background:linear-gradient(145deg,rgba(5,16,29,.62),rgba(3,10,21,.48))!important;border-color:rgba(71,161,222,.38)!important;backdrop-filter:blur(8px) saturate(120%);-webkit-backdrop-filter:blur(8px) saturate(120%);box-shadow:0 18px 55px rgba(0,0,0,.34),inset 0 1px rgba(255,255,255,.035)!important}
.nav button{background:rgba(4,14,28,.60)!important;backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.nav button.active{background:rgba(13,52,83,.76)!important;border-color:rgba(0,229,255,.78)!important}
</style>'''
          s = re.sub(r'<style id="prf-juca-police-bg-final">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style id="prf-juca-forensic-v3">.*?</style>', '', s, flags=re.S)
          s = re.sub(r'<style>\s*/\* PRF JUCA FORENSIC DASHBOARD THEME \*/.*?</style>', '', s, flags=re.S)
          s = s.replace('</head>', style + '\n</head>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "style: apply police neon background"
          git push