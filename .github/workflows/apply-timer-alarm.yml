name: Apply PRF JUCA timer fixes
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timer behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="const DB_VERSION=3,KEY='prfJucaDB',BACKUP_KEY='prfJucaDB_backup';const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);let db=loadDB(),editState={sessions:null,lessons:null,questions:null,simulados:null,syllabus:null};let cloudAuthenticated=false,cloudRevision=0,cloudSyncing=false,cloudPending=false,timerSeconds=0,timerInterval=null,timerRunning=false,timerStartedAt=null;"
          new="const DB_VERSION=3,KEY='prfJucaDB',BACKUP_KEY='prfJucaDB_backup';const $=id=>document.getElementById(id),localToday=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},today=localToday();let db=loadDB(),editState={sessions:null,lessons:null,questions:null,simulados:null,syllabus:null};let cloudAuthenticated=false,cloudRevision=0,cloudSyncing=false,cloudPending=false,timerSeconds=0,timerInterval=null,timerRunning=false,timerStartedAt=null,sessionMinutesManual=false,sessionMinutesAutoValue=0;"
          if old in s: s=s.replace(old,new,1)
          old="function updateClock(){const s=timerSeconds,h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('clock').textContent=[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':');$('sessionMinutes').value=Math.floor(s/60)}"
          new="function updateClock(){const s=timerSeconds,h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;$('clock').textContent=[h,m,sec].map(x=>String(x).padStart(2,'0')).join(':');sessionMinutesAutoValue=Math.floor(s/60);if(!sessionMinutesManual)$('sessionMinutes').value=sessionMinutesAutoValue}"
          if old in s: s=s.replace(old,new,1)
          old="$('startTimer').onclick=()=>{if(timerRunning)return;timerRunning=true;timerStartedAt=Date.now()-timerSeconds*1000;timerInterval=setInterval(()=>{timerSeconds=Math.floor((Date.now()-timerStartedAt)/1000);updateClock()},1000)};$('pauseTimer').onclick=()=>{if(!timerRunning)return;timerRunning=false;clearInterval(timerInterval);timerInterval=null;timerSeconds=Math.floor((Date.now()-timerStartedAt)/1000);updateClock()};$('resetTimer').onclick=()=>{timerRunning=false;clearInterval(timerInterval);timerInterval=null;timerSeconds=0;timerStartedAt=null;updateClock()};"
          new="$('sessionMinutes').addEventListener('input',()=>{sessionMinutesManual=true});$('startTimer').onclick=()=>{if(timerRunning)return;timerRunning=true;timerStartedAt=Date.now()-timerSeconds*1000;timerInterval=setInterval(()=>{timerSeconds=Math.floor((Date.now()-timerStartedAt)/1000);updateClock()},1000)};$('pauseTimer').onclick=()=>{if(!timerRunning)return;timerRunning=false;clearInterval(timerInterval);timerInterval=null;timerSeconds=Math.floor((Date.now()-timerStartedAt)/1000);updateClock()};$('resetTimer').onclick=()=>{timerRunning=false;clearInterval(timerInterval);timerInterval=null;timerSeconds=0;timerStartedAt=null;sessionMinutesManual=false;sessionMinutesAutoValue=0;updateClock()};"
          if old in s: s=s.replace(old,new,1)
          old="async function registerSession(){const subject=$('sessionSubject').value.trim();if(!subject){alert('Selecione uma disciplina cadastrada.');return}const minutes=Math.max(0,Number($('sessionMinutes').value)||0);db.sessions.unshift({id:uid(),date:$('sessionDate').value||today,subject,content:$('sessionContent').value.trim()||'Sessão de estudo',minutes,type:$('sessionType').value});await persist('Sessão registrada.');$('sessionContent').value='';$('sessionMinutes').value=0;$('resetTimer').click()};"
          new="async function registerSession(){const subject=$('sessionSubject').value.trim();if(!subject){alert('Selecione uma disciplina cadastrada.');return}const manualValue=Number($('sessionMinutes').value);const minutes=sessionMinutesManual?Math.max(0,Number.isFinite(manualValue)?manualValue:0):Math.round((timerSeconds/60)*100)/100;db.sessions.unshift({id:uid(),date:$('sessionDate').value||localToday(),subject,content:$('sessionContent').value.trim()||'Sessão de estudo',minutes,type:$('sessionType').value});await persist('Sessão registrada.');$('sessionContent').value='';$('sessionMinutes').value=0;sessionMinutesManual=false;sessionMinutesAutoValue=0;$('resetTimer').click()};"
          if old in s: s=s.replace(old,new,1)
          old="if(type==='sessions'){showView('timer');$('sessionDate').value=x.date;$('sessionSubject').value=x.subject;$('sessionContent').value=x.content;$('sessionMinutes').value=x.minutes;$('sessionType').value=x.type;editState.sessions=id;"
          new="if(type==='sessions'){showView('timer');$('sessionDate').value=x.date;$('sessionSubject').value=x.subject;$('sessionContent').value=x.content;$('sessionMinutes').value=x.minutes;sessionMinutesManual=true;sessionMinutesAutoValue=Number(x.minutes)||0;$('sessionType').value=x.type;editState.sessions=id;"
          if old in s: s=s.replace(old,new,1)
          old="$('sessionDate').value=today;$('lessonDate').value=today;$('questionDate').value=today;$('simuladoDate').value=today;"
          new="$('sessionDate').value=localToday();$('lessonDate').value=localToday();$('questionDate').value=localToday();$('simuladoDate').value=localToday();"
          if old in s: s=s.replace(old,new,1)
          old="if(new URLSearchParams(location.search).get('timerPopup')==='1'){document.body.classList.add('timer-popup-mode');setTimeout(()=>{showView('timer');$('openSeparateTimer').style.display='none'},0)}"
          new="if(new URLSearchParams(location.search).get('timerPopup')==='1'){document.body.classList.add('timer-popup-mode');setTimeout(()=>{showView('timer');$('openSeparateTimer').style.display='none';$('sessionDate').value=localToday()},0)}"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: timer session registration behavior"
          git push
