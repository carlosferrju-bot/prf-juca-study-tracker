name: Apply PRF JUCA timer fixes
on: [push]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch timer and dashboard behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          old="""async function pushCloud(force=false){if(!cloudAuthenticated||cloudSyncing)return false;cloudSyncing=true;cloudPending=true;try{const x=await cloudRequest('/api/data',{method:'PUT',body:JSON.stringify({db,baseRevision:force?0:cloudRevision})});cloudRevision=Number(x.revision)||cloudRevision+1;setCloudStatus('on',`🟢 Sincronizado • revisão ${cloudRevision}`);return true}catch(e){if(e.status===409&&e.data){db=normalizeDB(e.data.db);cloudRevision=Number(e.data.revision)||cloudRevision;saveLocal();renderAll();toast('Havia uma versão mais recente na nuvem. Ela foi carregada.')}else{setCloudStatus('error','🔴 Falha ao salvar na nuvem.');console.error(e)}return false}finally{cloudPending=false;cloudSyncing=false}}"""
          new="""function mergeRecords(localList,remoteList){const map=new Map((remoteList||[]).map(x=>[x.id,x]));(localList||[]).forEach(x=>map.set(x.id,x));return [...map.values()]}
          function mergeDatabases(localDB,remoteDB){const merged=normalizeDB(remoteDB);['sessions','lessons','questions','simulados','disciplines','syllabus'].forEach(k=>{merged[k]=mergeRecords(localDB[k],merged[k])});merged.goals={...merged.goals,...(localDB.goals||{})};merged.schedule={...merged.schedule,...(localDB.schedule||{}),completed:{...(merged.schedule?.completed||{}),...(localDB.schedule?.completed||{})}};return normalizeDB(merged)}
          async function pushCloud(force=false){if(!cloudAuthenticated||cloudSyncing)return false;cloudSyncing=true;cloudPending=true;try{const x=await cloudRequest('/api/data',{method:'PUT',body:JSON.stringify({db,baseRevision:force?0:cloudRevision})});cloudRevision=Number(x.revision)||cloudRevision+1;setCloudStatus('on',`🟢 Sincronizado • revisão ${cloudRevision}`);return true}catch(e){if(e.status===409&&e.data&&e.data.db){db=mergeDatabases(db,e.data.db);cloudRevision=Number(e.data.revision)||cloudRevision;saveLocal();renderAll();try{const x=await cloudRequest('/api/data',{method:'PUT',body:JSON.stringify({db,baseRevision:cloudRevision})});cloudRevision=Number(x.revision)||cloudRevision+1;setCloudStatus('on',`🟢 Sincronizado • revisão ${cloudRevision}`);toast('Sessão preservada e sincronizada com a nuvem.');return true}catch(retryError){setCloudStatus('error','🔴 Falha ao sincronizar após conflito. Os dados continuam salvos localmente.');console.error(retryError);return false}}setCloudStatus('error','🔴 Falha ao salvar na nuvem. Os dados continuam salvos localmente.');console.error(e);return false}finally{cloudPending=false;cloudSyncing=false}}"""
          if old in s:
              s=s.replace(old,new,1)

          old="""async function registerSession(){const subject=$('sessionSubject').value.trim();if(!subject){alert('Selecione uma disciplina cadastrada.');return}const manualValue=Number($('sessionMinutes').value);const minutes=sessionMinutesManual?Math.max(0,Number.isFinite(manualValue)?manualValue:0):Math.round((timerSeconds/60)*100)/100;db.sessions.unshift({id:uid(),date:$('sessionDate').value||localToday(),subject,content:$('sessionContent').value.trim()||'Sessão de estudo',minutes,type:$('sessionType').value});await persist('Sessão registrada.');$('sessionContent').value='';$('sessionMinutes').value=0;sessionMinutesManual=false;sessionMinutesAutoValue=0;$('resetTimer').click()};"""
          new="""async function registerSession(){const subject=$('sessionSubject').value.trim();if(!subject){alert('Selecione uma disciplina cadastrada.');return}const manualValue=Number($('sessionMinutes').value);const minutes=sessionMinutesManual?Math.max(0,Number.isFinite(manualValue)?manualValue:0):Math.round((timerSeconds/60)*100)/100;const record={id:uid(),date:$('sessionDate').value||localToday(),subject,content:$('sessionContent').value.trim()||'Sessão de estudo',minutes,type:$('sessionType').value};if(editState.sessions){const existing=db.sessions.find(v=>v.id===editState.sessions);if(existing)Object.assign(existing,record,{id:editState.sessions});editState.sessions=null;$('registerTimerSession').textContent='💾 Registrar tempo desta sessão'}else{db.sessions.unshift(record)}saveLocal();renderAll();toast('Sessão registrada.');$('sessionContent').value='';$('sessionMinutes').value=0;sessionMinutesManual=false;sessionMinutesAutoValue=0;$('resetTimer').click();if(cloudAuthenticated)await pushCloud()}"""
          if old in s:
              s=s.replace(old,new,1)

          old="""function renderDashboard(){const t=new Date(),k=t.toISOString().slice(0,10),month=k.slice(0,7);let day=0,week=0,mon=0;const d0=new Date(t);d0.setHours(0,0,0,0);const wd=d0.getDay();d0.setDate(d0.getDate()+(wd===0?-6:1-wd));const wk=d0.toISOString().slice(0,10);[...db.sessions,...db.lessons].forEach(x=>{const m=Number(x.minutes||0);if(x.date===k)day+=m;if(x.date>=wk)week+=m;if(x.date?.startsWith(month))mon+=m});$('dashToday').textContent=fmtMin(day);$('dashWeek').textContent=fmtMin(week);$('dashMonth').textContent=fmtMin(mon);$('dashQuestions').textContent=db.questions.reduce((a,x)=>a+Number(x.total||0),0);let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i),q=d.toISOString().slice(0,10),v=[...db.sessions,...db.lessons].filter(x=>x.date===q).reduce((a,x)=>a+Number(x.minutes||0),0);days.push({label:q.slice(8,10)+'/'+q.slice(5,7),value:v})}const max=Math.max(1,...days.map(x=>x.value));$('dayChart').innerHTML=days.map(x=>`<div class=\"bar\" style=\"height:${Math.max(3,x.value/max*90)}%\"><span>${fmtMin(x.value)}</span></div>`).join('');let dm={};[...db.sessions,...db.lessons].forEach(x=>{let n=x.subject||'Sem disciplina';dm[n]=(dm[n]||0)+Number(x.minutes||0)});let names=(db.disciplines||[]).map(d=>({name:d.name,color:d.color||'#00e5ff',acc:dm[d.name]||0}));let known=new Set(names.map(x=>x.name.toLowerCase()));Object.keys(dm).forEach(n=>{if(!known.has(n.toLowerCase()))names.push({name:n,color:'#718096',acc:dm[n]})});names.sort((a,b)=>b.acc-a.acc);const maxD=Math.max(1,...names.map(x=>x.acc));$('dashboardDisciplineList').innerHTML=names.length?names.map(d=>`<div style=\"margin:12px 0;padding-bottom:10px;border-bottom:1px solid var(--line)\"><div class=\"section\" style=\"margin:0\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:${d.color};display:inline-block\"></span><b>${esc(d.name)}</b></div></div><div style=\"display:flex;gap:14px;margin:7px 0 7px 20px;font-size:11px\"><span class=\"muted\">⏱ Acumulado: <b style=\"color:${d.color}\">${fmtMin(d.acc)}</b></span></div><div class=\"progress\"><i style=\"width:${d.acc?Math.max(2,d.acc/maxD*100):0}%;background:${d.color}\"></i></div></div>`).join(''):'<div class=\"empty\">Registre aulas ou sessões para visualizar.</div>';const groups={};db.syllabus.forEach(x=>(groups[x.discipline]??=[]).push(x));$('dashboardSyllabus').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([n,a])=>{const done=a.filter(x=>x.completed).length,pct=Math.round(done/a.length*100);return`<div style=\"margin:12px 0\"><div class=\"section\" style=\"margin:0\"><b>${esc(n)}</b><span class=\"muted\">${done}/${a.length} • ${pct}%</span></div><div class=\"progress\"><i style=\"width:${pct}%\"></i></div></div>`}).join(''):'<div class=\"empty\">Cadastre tópicos no Edital para acompanhar o progresso.</div>'}"""
          new="""function renderDashboard(){const localKey=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const t=new Date(),k=localKey(t),month=k.slice(0,7);let day=0,week=0,mon=0;const d0=new Date(t);d0.setHours(0,0,0,0);const wd=d0.getDay();d0.setDate(d0.getDate()+(wd===0?-6:1-wd));const wk=localKey(d0);[...db.sessions,...db.lessons].forEach(x=>{const m=Number(x.minutes||0);if(x.date===k)day+=m;if(x.date>=wk)week+=m;if(x.date?.startsWith(month))mon+=m});$('dashToday').textContent=fmtMin(day);$('dashWeek').textContent=fmtMin(week);$('dashMonth').textContent=fmtMin(mon);$('dashQuestions').textContent=db.questions.reduce((a,x)=>a+Number(x.total||0),0);let days=[];for(let i=6;i>=0;i--){let d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const q=localKey(d),v=[...db.sessions,...db.lessons].filter(x=>x.date===q).reduce((a,x)=>a+Number(x.minutes||0),0);days.push({label:q.slice(8,10)+'/'+q.slice(5,7),value:v})}const max=Math.max(1,...days.map(x=>x.value));$('dayChart').innerHTML=days.map(x=>`<div class=\"bar\" style=\"height:${Math.max(3,x.value/max*90)}%\"><span>${fmtMin(x.value)}</span></div>`).join('');let dm={};[...db.sessions,...db.lessons].forEach(x=>{let n=x.subject||'Sem disciplina';dm[n]=(dm[n]||0)+Number(x.minutes||0)});let names=(db.disciplines||[]).map(d=>({name:d.name,color:d.color||'#00e5ff',acc:dm[d.name]||0}));let known=new Set(names.map(x=>x.name.toLowerCase()));Object.keys(dm).forEach(n=>{if(!known.has(n.toLowerCase()))names.push({name:n,color:'#718096',acc:dm[n]})});names.sort((a,b)=>b.acc-a.acc);const maxD=Math.max(1,...names.map(x=>x.acc));$('dashboardDisciplineList').innerHTML=names.length?names.map(d=>`<div style=\"margin:12px 0;padding-bottom:10px;border-bottom:1px solid var(--line)\"><div class=\"section\" style=\"margin:0\"><div style=\"display:flex;align-items:center;gap:8px\"><span style=\"width:12px;height:12px;border-radius:50%;background:${d.color};display:inline-block\"></span><b>${esc(d.name)}</b></div></div><div style=\"display:flex;gap:14px;margin:7px 0 7px 20px;font-size:11px\"><span class=\"muted\">⏱ Acumulado: <b style=\"color:${d.color}\">${fmtMin(d.acc)}</b></span></div><div class=\"progress\"><i style=\"width:${d.acc?Math.max(2,d.acc/maxD*100):0}%;background:${d.color}\"></i></div></div>`).join(''):'<div class=\"empty\">Registre aulas ou sessões para visualizar.</div>';const groups={};db.syllabus.forEach(x=>(groups[x.discipline]??=[]).push(x));$('dashboardSyllabus').innerHTML=Object.keys(groups).length?Object.entries(groups).map(([n,a])=>{const done=a.filter(x=>x.completed).length,pct=Math.round(done/a.length*100);return`<div style=\"margin:12px 0\"><div class=\"section\" style=\"margin:0\"><b>${esc(n)}</b><span class=\"muted\">${done}/${a.length} • ${pct}%</span></div><div class=\"progress\"><i style=\"width:${pct}%\"></i></div></div>`}).join(''):'<div class=\"empty\">Cadastre tópicos no Edital para acompanhar o progresso.</div>'}"""
          if old not in s: raise SystemExit('renderDashboard block not found')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: use local dates in dashboard session totals"
          git push
