name: Remove obsolete sync button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  remove-button:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove obsolete synchronization button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button class="btn ghost" id="openCloudLogin">☁️ Sincronização</button>'
          if old in s:
              p.write_text(s.replace(old, ''), encoding='utf-8')

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            git rm -f .github/workflows/remove-sync-button.yml
          else
            git add index.html
            git rm -f .github/workflows/remove-sync-button.yml
          fi
          git commit -m "Remove obsolete synchronization button"
          git push
