name: Remove obsolete sync handler

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove handler for deleted button
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "$('openCloudLogin').onclick=()=>{$('cloudLogin').classList.remove('hidden');$('cloudPassword').focus()};"
          if old in s:
              p.write_text(s.replace(old, ''), encoding='utf-8')
      - name: Commit and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/cleanup-sync-handler.yml
          git add index.html
          git diff --cached --quiet || git commit -m "fix: remove obsolete sync button handler"
          git push
